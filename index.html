<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Security Services</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0b1f3a, #000000 75%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .splash {
      text-align: center;
      padding: 32px 20px;
      max-width: 360px;
      width: 100%;
      z-index: 2;
    }

    .logo-wrapper {
      width: 150px;
      height: 150px;
      margin: 0 auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(53,208,127,0.25), transparent 65%);
      box-shadow: 0 0 35px rgba(53,208,127,0.35);
      animation: glow 3s ease-in-out infinite;
    }

    .logo {
      width: 120px;
      height: 120px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .subtitle {
      font-size: 1.05rem;
      opacity: 0.95;
      margin-bottom: 12px;
    }

    .status {
      font-size: 0.9rem;
      color: #35d07f;
      margin-bottom: 14px;
      min-height: 1.2em;
    }

    .progress {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #35d07f, #3fa9f5);
      animation: load 3s forwards ease-in-out;
    }

    footer {
      position: absolute;
      bottom: 14px;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      opacity: 0.6;
    }

    .compliance {
      position: absolute;
      bottom: 32px;
      width: 100%;
      text-align: center;
      font-size: 0.6rem;
      opacity: 0.5;
    }

    .particle {
      position: absolute;
      font-size: 14px;
      opacity: 0.12;
      animation: float 12s linear infinite;
    }

    @keyframes load {
      to { width: 100%; }
    }

    @keyframes float {
      from { transform: translateY(110vh); }
      to { transform: translateY(-120vh); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 30px rgba(53,208,127,0.25); }
      50% { box-shadow: 0 0 45px rgba(53,208,127,0.45); }
    }
  </style>
</head>
<body>

  <!-- Floating security particles -->
  <div class="particle" style="left:12%; animation-duration:14s">🔒</div>
  <div class="particle" style="left:28%; animation-duration:11s">🔐</div>
  <div class="particle" style="left:52%; animation-duration:16s">🔒</div>
  <div class="particle" style="left:70%; animation-duration:13s">🔐</div>
  <div class="particle" style="left:88%; animation-duration:18s">🔒</div>

  <div class="splash">
    <div class="logo-wrapper">
      <img src="shield-logo.png" alt="Security Shield" class="logo" />
    </div>
    <h1>Account Security Services</h1>
    <div class="subtitle">Securing Your BVN &amp; NIN...</div>
    <div class="status" id="statusText">Initializing Secure Environment</div>
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>

  <div class="compliance">Compliant with Nigerian Data Protection Regulations (NDPR)</div>
  <footer>Powered by CBN Technology</footer>

  <script>
    const messages = [
      "Initializing Secure Environment",
      "Encrypting Identity Data",
      "Verifying Protection Layers",
      "Finalizing Security Check"
    ];

    let index = 0;
    const statusText = document.getElementById('statusText');

    setInterval(() => {
      index = (index + 1) % messages.length;
      statusText.textContent = messages[index];
    }, 750);

    // Simulated redirect for WebView apps
    setTimeout(() => {
      // window.location.href = 'home.html';
    }, 3200);
  </script>

</body>
</html>
